# Runs on every pull request: Git sync deploys whatever lands on main, so broken
# or non-compliant templates must never get there. App tests run in onward-orders-app.
name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "cfn-lint>=1,<2"
      - name: Lint CloudFormation
        run: cfn-lint --regions eu-west-1 --ignore-checks W2001 -- templates/*.yaml bootstrap/*.yaml
      - name: Company standards (no inline policies, users, keys or SSH)
        run: bash scripts/check_standards.sh
