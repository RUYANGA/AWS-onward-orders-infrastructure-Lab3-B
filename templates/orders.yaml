AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Onward Logistics, sales-day order system on EC2. One internet-facing
  Application Load Balancer (the only public resource) in front of an Auto
  Scaling group of private Amazon Linux 2023 servers in two Availability Zones.
  Servers install and start the order application themselves at boot, scale on
  CPU, reach the internet only outbound through a Regional NAT Gateway, and are
  managed through Systems Manager with no SSH and no open admin ports.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod
  Owner:
    Type: String
    Description: Your full name. Shown on the page and used in tags.
    AllowedPattern: ^[^$`"\\]{2,64}$
  AppRepoUrl:
    Type: String
    Description: Public HTTPS URL of this repository; servers clone the app from it at boot.
    AllowedPattern: ^https://.+\.git$
  AppVersion:
    Type: String
    Default: main
    Description: >-
      Git branch, tag or commit SHA to run. Changing it rolls new servers out
      one at a time. Prefer a tag or SHA so every server runs the same code.
    AllowedPattern: ^[A-Za-z0-9._/-]{1,64}$
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t2.micro
    Description: Free Tier eligible types only.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 image, resolved from the AWS public parameter.
  MinSize:
    Type: Number
    Default: 2
    MinValue: 2
    Description: At least 2, one per Availability Zone, so losing a zone never leaves zero servers.
  MaxSize:
    Type: Number
    Default: 6
    MaxValue: 10
  CpuTargetPercent:
    Type: Number
    Default: 50
    MinValue: 20
    MaxValue: 90
  VpcCidr:
    Type: String
    Default: 10.30.0.0/16
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/16$

Resources:
  # =================================================================== Network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "onward-${Environment}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "onward-${Environment}-igw"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Public subnets hold ONLY the load balancer.
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      CidrBlock: !Select
        - 0
        - !Cidr
            - !Ref VpcCidr
            - 4
            - 8
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "onward-${Environment}-public-a"

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      CidrBlock: !Select
        - 1
        - !Cidr
            - !Ref VpcCidr
            - 4
            - 8
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "onward-${Environment}-public-b"

  # Private subnets hold the servers. No public IPs; outbound only via NAT.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      CidrBlock: !Select
        - 2
        - !Cidr
            - !Ref VpcCidr
            - 4
            - 8
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "onward-${Environment}-private-a"

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      CidrBlock: !Select
        - 3
        - !Cidr
            - !Ref VpcCidr
            - 4
            - 8
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "onward-${Environment}-private-b"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "onward-${Environment}-public"

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # One NAT gateway for the whole VPC. In regional mode AWS runs it in every
  # zone that has servers and expands or contracts it automatically, so a zone
  # outage does not cut the other zone's outbound access. It needs no subnet of
  # its own; AWS creates its route table with a route to the internet gateway.
  RegionalNatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: InternetGatewayAttachment
    Properties:
      AvailabilityMode: regional
      ConnectivityType: public
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "onward-${Environment}-nat"

  # Both private subnets share one route table: the same NAT ID works in every zone.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "onward-${Environment}-private"

  PrivateOutboundRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref RegionalNatGateway

  PrivateSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # =================================================================== Security groups
  # internet -> ALB :80 -> servers :8000. Nothing else comes in.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "onward-${Environment}-alb"
      GroupDescription: Public entry point. HTTP in from anywhere; out only to the order servers.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Customers and merchants
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          DestinationSecurityGroupId: !Ref ServerSecurityGroup
          Description: Requests and health checks to the order servers
      Tags:
        - Key: Name
          Value: !Sub "onward-${Environment}-alb"

  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "onward-${Environment}-orders-servers"
      GroupDescription: Order servers. In only from the ALB on 8000 (no SSH). Out HTTPS only, through the NAT gateway.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        # Package updates, pip, git clone, Systems Manager and CloudFormation
        # signals all use HTTPS. DNS and time use VPC-internal link-local
        # services that security groups do not filter.
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS out for updates and AWS APIs
      Tags:
        - Key: Name
          Value: !Sub "onward-${Environment}-orders-servers"

  ServerIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ServerSecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: Only the load balancer may reach the app

  # =================================================================== Load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "onward-${Environment}-orders"
      Type: application
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "onward-${Environment}-orders"
      VpcId: !Ref Vpc
      TargetType: instance
      Protocol: HTTP
      Port: 8000
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        # drain fast on scale-in
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
        # spread every request
        - Key: stickiness.enabled
          Value: "false"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # =================================================================== Server identity (managed policies only)
  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onward-${Environment}-orders-server"
      Description: Identity of the order servers. Systems Manager access only (Session Manager, Run Command).
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"

  ServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "onward-${Environment}-orders-server"
      Roles:
        - !Ref ServerRole

  # =================================================================== Servers
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "onward-${Environment}-orders"
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: Project
              Value: onward
            - Key: Owner
              Value: !Ref Owner
            - Key: Environment
              Value: !Ref Environment
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt ServerInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref ServerSecurityGroup
        # No KeyName: there is no SSH key. Admin access is Session Manager.
        MetadataOptions:
          HttpTokens: required          # IMDSv2 only
          HttpPutResponseHopLimit: 1
          HttpEndpoint: enabled
        Monitoring:
          Enabled: true                 # 1-minute CPU metrics so scaling reacts quickly
        CreditSpecification:
          CpuCredits: unlimited         # keeps CPU honest under load instead of throttling to baseline
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 8
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub "onward-${Environment}-orders"
              - Key: Project
                Value: onward
              - Key: Owner
                Value: !Ref Owner
              - Key: Environment
                Value: !Ref Environment
          - ResourceType: network-interface
            Tags:
              - Key: Name
                Value: !Sub "onward-${Environment}-orders"
              - Key: Project
                Value: onward
              - Key: Owner
                Value: !Ref Owner
              - Key: Environment
                Value: !Ref Environment
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # Runs once when a server first boots: update, install the app, start it,
            # check it locally, then tell CloudFormation the server is ready.
            set -euo pipefail
            exec > >(tee -a /var/log/onward-bootstrap.log) 2>&1
            signal() { /opt/aws/bin/cfn-signal -e "$1" --stack '${AWS::StackName}' --resource AutoScalingGroup --region '${AWS::Region}' || true; }
            trap 'signal 1' ERR

            echo "== Security updates (proves outbound access through the NAT gateway)"
            dnf -y upgrade --security
            dnf -y install git python3.11 aws-cfn-bootstrap

            echo "== Fetch the application at version ${AppVersion}"
            useradd --system --home-dir /opt/onward --shell /sbin/nologin onward || true
            rm -rf /opt/onward && mkdir -p /opt/onward
            git clone --quiet '${AppRepoUrl}' /opt/onward/src
            git -C /opt/onward/src checkout --quiet '${AppVersion}'
            python3.11 -m venv /opt/onward/venv
            /opt/onward/venv/bin/pip install --quiet -r /opt/onward/src/app/requirements.txt

            mkdir -p /etc/onward
            cat > /etc/onward/app.env <<'ENVFILE'
            OWNER_NAME=${Owner}
            ENVIRONMENT=${Environment}
            APP_VERSION=${AppVersion}
            ENVFILE
            echo "APP_COMMIT=$(git -C /opt/onward/src rev-parse --short HEAD)" >> /etc/onward/app.env
            chown -R root:root /opt/onward && chmod -R a+rX /opt/onward

            echo "== Run the app as a locked-down service that restarts on failure"
            cat > /etc/systemd/system/onward-orders.service <<'UNIT'
            [Unit]
            Description=Onward order desk
            After=network-online.target
            Wants=network-online.target

            [Service]
            User=onward
            WorkingDirectory=/opt/onward/src/app
            EnvironmentFile=/etc/onward/app.env
            ExecStart=/opt/onward/venv/bin/gunicorn -c gunicorn.conf.py wsgi:app
            Restart=always
            RestartSec=2
            NoNewPrivileges=yes
            ProtectSystem=strict
            ProtectHome=yes
            PrivateTmp=yes

            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload
            systemctl enable --now onward-orders

            echo "== Local health check"
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
            curl -fsS http://127.0.0.1:8000/health
            signal 0

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    # servers need the NAT route to boot
    DependsOn:
      - PrivateOutboundRoute
      - PrivateSubnetARoutes
      - PrivateSubnetBRoutes
    CreationPolicy:
      ResourceSignal:
        Count: !Ref MinSize
        Timeout: PT15M
    UpdatePolicy:
      # A new AppVersion or launch template replaces servers one at a time,
      # each new one proving itself healthy before the next is replaced.
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT15M
        WaitOnResourceSignals: true
        SuspendProcesses:
          - HealthCheck
          - ReplaceUnhealthy
          - AZRebalance
          - AlarmNotification
          - ScheduledActions
    Properties:
      AutoScalingGroupName: !Sub "onward-${Environment}-orders"
      VPCZoneIdentifier:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      TargetGroupARNs:
        - !Ref TargetGroup
      HealthCheckType: ELB              # replace servers the load balancer finds unhealthy, not just dead ones
      HealthCheckGracePeriod: 300
      DefaultInstanceWarmup: 180
      MetricsCollection:
        - Granularity: 1Minute          # group size metrics for the dashboard (no charge)
      Tags:
        - Key: Name
          Value: !Sub "onward-${Environment}-orders"
          PropagateAtLaunch: true
        - Key: Project
          Value: onward
          PropagateAtLaunch: true
        - Key: Owner
          Value: !Ref Owner
          PropagateAtLaunch: true
        - Key: Environment
          Value: !Ref Environment
          PropagateAtLaunch: true

  CpuTargetTracking:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: !Ref CpuTargetPercent

  # =================================================================== Load-spike demo (secure, no public trigger)
  CpuSpikeDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub "onward-${Environment}-orders-cpu-spike"
      DocumentType: Command
      DocumentFormat: YAML
      Content:
        schemaVersion: "2.2"
        description: >-
          Run a time-limited CPU spike on Onward order servers to demonstrate
          automatic scaling. Requires IAM permission to send this command;
          every run is logged in Systems Manager and CloudTrail.
        parameters:
          Minutes:
            type: String
            default: "10"
            description: How long to burn CPU (1 to 15 minutes).
            allowedPattern: ^([1-9]|1[0-5])$
        mainSteps:
          - action: aws:runShellScript
            name: StartCpuSpike
            inputs:
              runCommand:
                - "nohup /opt/onward/venv/bin/python /opt/onward/src/scripts/cpu_spike.py --minutes {{ Minutes }} > /var/log/onward-cpu-spike.log 2>&1 &"
                - "echo \"CPU spike started on $(hostname) for {{ Minutes }} minutes\""
      Tags:
        - Key: Project
          Value: onward
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # =================================================================== Operations view
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "onward-${Environment}-orders"
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              { "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
                "properties": { "title": "Servers in service (desired vs running)", "region": "${AWS::Region}", "stat": "Average", "period": 60, "view": "timeSeries",
                  "metrics": [
                    [ "AWS/AutoScaling", "GroupDesiredCapacity", "AutoScalingGroupName", "${Asg}" ],
                    [ ".", "GroupInServiceInstances", ".", "." ] ] } },
              { "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
                "properties": { "title": "Average CPU across the group (scaling target ${CpuTargetPercent}%)", "region": "${AWS::Region}", "stat": "Average", "period": 60, "view": "timeSeries",
                  "metrics": [ [ "AWS/EC2", "CPUUtilization", "AutoScalingGroupName", "${Asg}" ] ],
                  "annotations": { "horizontal": [ { "value": ${CpuTargetPercent}, "label": "target" } ] } } },
              { "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
                "properties": { "title": "CPU by server (which servers are working)", "region": "${AWS::Region}", "period": 60, "view": "timeSeries",
                  "metrics": [ [ { "expression": "SEARCH('{AWS/EC2,InstanceId} MetricName=\"CPUUtilization\"', 'Average', 60)", "id": "byServer" } ] ] } },
              { "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
                "properties": { "title": "Load balancer: requests, healthy servers, errors", "region": "${AWS::Region}", "period": 60, "view": "timeSeries",
                  "metrics": [
                    [ "AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${AlbName}", { "stat": "Sum" } ],
                    [ "AWS/ApplicationELB", "HealthyHostCount", "TargetGroup", "${TgName}", "LoadBalancer", "${AlbName}", { "stat": "Minimum", "yAxis": "right" } ],
                    [ "AWS/ApplicationELB", "HTTPCode_ELB_5XX_Count", "LoadBalancer", "${AlbName}", { "stat": "Sum" } ] ] } }
            ]
          }
        - Asg: !Sub "onward-${Environment}-orders"
          AlbName: !GetAtt LoadBalancer.LoadBalancerFullName
          TgName: !GetAtt TargetGroup.TargetGroupFullName

Outputs:
  AppUrl:
    Description: The single public address of the order system
    Value: !Sub "http://${LoadBalancer.DNSName}"
  AutoScalingGroupName:
    Value: !Ref AutoScalingGroup
  CpuSpikeDocumentName:
    Value: !Ref CpuSpikeDocument
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=onward-${Environment}-orders"
  NatGatewayId:
    Value: !Ref RegionalNatGateway
  PrivateRouteTableId:
    Value: !Ref PrivateRouteTable
  VpcId:
    Value: !Ref Vpc
